name: Build Android APK (Flutter)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Initialize Android Scaffolding & Plugins
        run: |
          flutter create --org com.soundrip --project-name soundrip .
          flutter pub add youtube_explode_dart path_provider open_filex share_plus
          # Set compileSdk 35
          sed -i 's/compileSdk.*/compileSdk = 35/g' android/app/build.gradle* || true
          sed -i 's/compileSdkVersion.*/compileSdkVersion 35/g' android/app/build.gradle* || true
          # Add Internet and Storage Permissions
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:requestLegacyExternalStorage="true"/g' android/app/src/main/AndroidManifest.xml

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoundRip-Android-Release
          path: build/app/outputs/flutter-apk/app-release.apk
